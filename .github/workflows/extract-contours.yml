name: Extract NJ contour vectors
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'EPSG:6527 bbox west south east north (feet)'
        required: false
        default: '390000 650000 450000 710000'
  push:
    branches: [main]
    paths:
      - 'scripts/build_contours.py'
      - '.github/workflows/extract-contours.yml'

permissions:
  contents: write

concurrency:
  group: contour-vectors-dataset
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin
      - name: Extract 10-foot contours
        env:
          BBOX: ${{ inputs.bbox || '390000 650000 450000 710000' }}
        run: |
          read -r WEST SOUTH EAST NORTH <<< "$BBOX"
          python3 scripts/build_contours.py --bbox "$WEST" "$SOUTH" "$EAST" "$NORTH"
          test -s build/contours.geojsonseq
          gzip -9 -n build/contours.geojsonseq
          (cd build && sha256sum contours.geojsonseq.gz > contours.geojsonseq.gz.sha256)
          ls -lh build/contours.geojsonseq.gz
      - name: Record extraction parameters
        env:
          BBOX: ${{ inputs.bbox || '390000 650000 450000 710000' }}
        run: |
          python - <<'PYMETA'
          import json, os
          from pathlib import Path
          Path('build/extraction.json').write_text(json.dumps({
              'bbox': [int(value) for value in os.environ['BBOX'].split()],
              'crs': 'EPSG:6527', 'vertical_interval_ft': 10,
              'source': 'https://maps.nj.gov/arcgis/rest/services/Elevation/NJ_10ft_DEM/ImageServer',
          }, indent=2) + '\n')
          PYMETA
      - name: Publish versioned contour vector release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_releases create contour-vectors build
