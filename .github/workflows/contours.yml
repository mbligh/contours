name: Build NJ contour PMTiles
on:
  workflow_run:
    workflows: ["Extract NJ contour vectors"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/contours.yml'
      - 'scripts/dataset_releases'
  workflow_dispatch:
    inputs:
      vector_release_tag:
        description: 'Contour-vector release tag; blank reuses the latest complete vector release'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: contours-dataset
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify released contour vectors
        id: vectors
        env:
          GH_TOKEN: ${{ github.token }}
          VECTOR_TAG: ${{ inputs.vector_release_tag }}
          EXTRACTION_RUN: ${{ github.event.workflow_run.id }}
          EXTRACTION_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then
            VECTOR_TAG="dataset-contour-vectors-${EXTRACTION_RUN}-${EXTRACTION_ATTEMPT}"
          fi
          args=()
          if [ "$EVENT_NAME" = push ]; then
            args+=(--allow-missing)
          fi
          python scripts/dataset_releases download contour-vectors build --tag "$VECTOR_TAG" "${args[@]}"
      - name: Uncompress verified vectors
        if: steps.vectors.outputs.found == 'true'
        run: |
          cd build
          sha256sum -c contours.geojsonseq.gz.sha256
          gunzip contours.geojsonseq.gz
          test -s contours.geojsonseq
          mkdir -p output
      - name: Install Tippecanoe
        if: steps.vectors.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe
      - name: Build PMTiles
        if: steps.vectors.outputs.found == 'true'
        run: |
          tippecanoe -o build/output/contours.pmtiles -l contours -Z 9 -z 16 \
            --no-feature-limit --no-tile-size-limit --force -P \
            build/contours.geojsonseq
          test "$(stat -c%s build/output/contours.pmtiles)" -gt 10000
          ls -lh build/output/contours.pmtiles
      - name: Publish versioned contour release
        if: steps.vectors.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_releases create contours build/output --input-manifest build/vector-selection.manifest.json
      - name: Keep three versions of successfully consumed vectors
        if: steps.vectors.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_releases cleanup --selection build/vector-selection.json
