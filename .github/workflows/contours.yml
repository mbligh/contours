name: Build NJ contour PMTiles
on:
  workflow_run:
    workflows: ["Extract NJ contour vectors"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      extraction_run_id:
        description: 'Successful Extract NJ contour vectors run ID to reuse'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: contours-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download extracted vectors from earlier workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.extraction_run_id }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p build public
          gh run download "$RUN_ID" --repo "$REPO" --name contour-vectors --dir build
          cd build
          sha256sum -c contours.geojsonseq.gz.sha256
          gunzip contours.geojsonseq.gz
          test -s contours.geojsonseq
      - name: Install Tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe
      - name: Build PMTiles
        run: |
          tippecanoe -o public/contours.pmtiles -l contours -Z 9 -z 16 \
            --no-feature-limit --no-tile-size-limit --force -P \
            build/contours.geojsonseq
          test "$(stat -c%s public/contours.pmtiles)" -gt 10000
          ls -lh public/contours.pmtiles
      - name: Prepare Pages
        run: |
          cp site/index.html public/index.html
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
