name: Build NJ contour PMTiles
on:
  workflow_run:
    workflows: ["Extract NJ contour vectors"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/contours.yml'
      - 'scripts/dataset_releases'
  workflow_dispatch:
    inputs:
      extraction_run_id:
        description: 'Extraction run ID; blank reuses the latest successful extraction'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: contours-dataset
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download extracted vectors from earlier workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.extraction_run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$REPO" --workflow extract-contours.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$RUN_ID"
          mkdir -p build build/output
          gh run download "$RUN_ID" --repo "$REPO" --name contour-vectors --dir build
          cd build
          sha256sum -c contours.geojsonseq.gz.sha256
          gunzip contours.geojsonseq.gz
          test -s contours.geojsonseq
      - name: Install Tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe
      - name: Build PMTiles
        run: |
          tippecanoe -o build/output/contours.pmtiles -l contours -Z 9 -z 16 \
            --no-feature-limit --no-tile-size-limit --force -P \
            build/contours.geojsonseq
          test "$(stat -c%s build/output/contours.pmtiles)" -gt 10000
          ls -lh build/output/contours.pmtiles
      - name: Publish versioned contour release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_releases create contours build/output
