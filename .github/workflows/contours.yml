name: Build NJ contour PMTiles
on:
  workflow_run:
    workflows: ["Extract NJ contour vectors"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/contours.yml'
      - 'scripts/dataset_releases'
  workflow_dispatch:
    inputs:
      vector_release_tag:
        description: 'Contour-vector release tag; blank reuses the latest complete vector release'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: contours-dataset
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download extracted contour vectors
        id: vectors
        env:
          GH_TOKEN: ${{ github.token }}
          EXTRACTION_RUN: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p build
          if [ "$EVENT_NAME" = workflow_run ]; then
            gh run download "$EXTRACTION_RUN" --repo "$GITHUB_REPOSITORY" --name contour-vectors-combined --dir build
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            # Explicit manual/push build: reuse the most recent successful extraction artifact.
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow extract-contours.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$RUN_ID" ]; then
              echo 'found=false' >> "$GITHUB_OUTPUT"
            else
              gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name contour-vectors-combined --dir build
              echo 'found=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Uncompress verified vectors
        if: steps.vectors.outputs.found == 'true'
        run: |
          cd build
          sha256sum -c contours.geojsonseq.gz.sha256
          gunzip contours.geojsonseq.gz
          test -s contours.geojsonseq
          mkdir -p output
      - name: Install Tippecanoe
        if: steps.vectors.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe
      - name: Build PMTiles
        if: steps.vectors.outputs.found == 'true'
        run: |
          tippecanoe -o build/output/contours.pmtiles -l contours -Z 9 -z 16 \
            --no-feature-limit --no-tile-size-limit --force -P \
            build/contours.geojsonseq
          test "$(stat -c%s build/output/contours.pmtiles)" -gt 10000
          ls -lh build/output/contours.pmtiles
      - name: Publish versioned contour release
        if: steps.vectors.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_releases create contours build/output
