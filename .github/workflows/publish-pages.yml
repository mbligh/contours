name: Publish mapping pages
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/publish-pages.yml'
      - 'scripts/dataset_releases'
      - 'scripts/test_dataset_releases'
      - 'scripts/public_directory_indexes'
      - 'scripts/test_public_directory_indexes'
      - 'scripts/test_geosources.cjs'
      - 'scripts/build_njaddress'
      - 'scripts/test_njaddress'
  workflow_run:
    workflows: ['Refresh NJ shipping locations', 'Build NJ contour PMTiles', 'Build NJ address database']
    types: [completed]
    branches: [main]
  release:
    types: [published, edited, deleted]
  repository_dispatch:
    types: [mapping-release-assets-updated]
  workflow_dispatch:
  # Individual asset uploads/replacements emit no Actions release event.
  # Polling catches those edits; unchanged inputs do not redeploy.
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mapping-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check map browser modules
        run: |
          node --test public/editor/test-model.mjs
          node scripts/test_geosources.cjs
          node public/shipping/test_shipping.cjs
      - name: Check GeoJSON editor in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/editor-test" --no-save playwright@1.56.1 esbuild@0.25.12 maplibre-gl@6.11.2 terra-draw@1.24.2 terra-draw-maplibre-gl-adapter@1.1.2
          "$RUNNER_TEMP/editor-test/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/editor-test/node_modules" node public/editor/test-browser.cjs
      - name: Upload editor screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-test-failure
          path: editor-test-failure.png
          if-no-files-found: ignore
      - name: Check assembly, checksum validation, and retention
        run: |
          python scripts/test_njaddress
          python scripts/test_dataset_releases
          python scripts/test_public_directory_indexes
      - name: Generate recursive public directory listings
        run: python scripts/public_directory_indexes public
      - name: Assemble latest complete releases and static files
        id: assemble
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_releases assemble
      - uses: actions/configure-pages@v5
        if: steps.assemble.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.assemble.outputs.changed == 'true'
        with:
          path: .pages
      - name: Deploy Pages
        if: steps.assemble.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep three versions of each deployed dataset
        if: steps.assemble.outputs.changed == 'true' && steps.deployment.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_releases cleanup


