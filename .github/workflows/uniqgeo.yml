name: Test GeoJSON deduplication filter
on:
  push:
    branches: [main]
    paths:
      - 'scripts/uniqgeo'
      - 'scripts/test_uniqgeo'
      - 'public/geojson/home_depot'
      - '.github/workflows/uniqgeo.yml'
  pull_request:
    paths:
      - 'scripts/uniqgeo'
      - 'scripts/test_uniqgeo'
      - 'public/geojson/home_depot'
      - '.github/workflows/uniqgeo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rapidfuzz
        run: python -m pip install rapidfuzz
      - name: Test fuzzy matching, grouping, and GeoJSON filter
        run: python scripts/test_uniqgeo
