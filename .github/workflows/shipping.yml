name: Refresh NJ shipping locations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shipping.yml'
      - 'public/shipping/**'
      - 'scripts/dataset_releases'
      - 'mapping_quality/**'
      - 'scripts/clean_locations'
      - 'tests/test_location_quality.py'
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * 0'
permissions:
  contents: write
concurrency:
  group: shipping-dataset
  # Code fixes supersede an unfinished rebuild; scheduled/manual runs queue.
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install osmium beautifulsoup4
      - name: Check shipping importers and browser module
        run: |
          python -m unittest discover -s tests -p 'test_location_quality.py'
          python public/shipping/test_fedex
          python public/shipping/test_shipping_geometry
          python public/shipping/test_mailinglocations
          python public/shipping/test_usps
          python public/shipping/test_shipping_extra
          node public/shipping/test_shipping.cjs
          python public/shipping/validate_data
      - name: Download New Jersey OSM extract
        run: curl -fL --retry 3 https://download.geofabrik.de/north-america/us/new-jersey-latest.osm.pbf -o /tmp/new-jersey.osm.pbf
      - run: python -u public/shipping/build_shipping.py
      - run: python -u public/shipping/build_usps
      - run: python -u public/shipping/build_shipping_extra.py
      - run: python -u public/shipping/build_fedex
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/mailinglocations-cache
          key: shipping-mailinglocations-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shipping-mailinglocations-v1-
      - run: python -u public/shipping/build_mailinglocations
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/mailinglocations-cache
          key: shipping-mailinglocations-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore shared address-reference cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/mapping-location-quality
          key: location-quality-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: location-quality-v1-
      - name: Clean directory coordinates using independent address points
        run: python scripts/clean_locations public/shipping/*.geojson --source 'All The Places' --source MailingLocations --cache-dir /tmp/mapping-location-quality
      - name: Save shared address-reference cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/mapping-location-quality
          key: location-quality-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate rebuilt shipping data
        run: python public/shipping/validate_data
      - name: Commit shipping datasets
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/shipping/*.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NJ shipping locations"
            for attempt in 1 2 3 4 5; do
              git fetch origin "$BRANCH"
              git rebase -X ours "origin/$BRANCH"
              if git push origin "HEAD:$BRANCH"; then
                exit 0
              fi
              sleep 3
            done
            echo 'Unable to publish shipping datasets after 5 attempts' >&2
            exit 1
          fi
      - name: Publish versioned shipping release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_releases create shipping public
