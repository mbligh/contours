name: Refresh NJ shipping locations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shipping.yml'
      - 'shipping/**'
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * 0'
permissions:
  contents: write
  pages: write
  id-token: write
# Both independent publishers retain all assets and serialize Pages deployments.
concurrency:
  group: contours-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install osmium beautifulsoup4
      - name: Check shipping importers and browser module
        run: |
          python shipping/test_fedex
          python shipping/test_shipping_geometry
          python shipping/test_mailinglocations
          node shipping/test_shipping.cjs
          python shipping/validate_data
      - name: Download New Jersey OSM extract
        run: curl -fL --retry 3 https://download.geofabrik.de/north-america/us/new-jersey-latest.osm.pbf -o /tmp/new-jersey.osm.pbf
      - run: python -u shipping/build_shipping.py
      - run: python -u shipping/build_shipping_extra.py
      - run: python -u shipping/build_fedex
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/mailinglocations-cache
          key: shipping-mailinglocations-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shipping-mailinglocations-v1-
      - run: python -u shipping/build_mailinglocations
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/mailinglocations-cache
          key: shipping-mailinglocations-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate rebuilt shipping data
        run: python shipping/validate_data
      - name: Commit shipping datasets
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shipping/*.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NJ shipping locations"
            for attempt in 1 2 3 4 5; do
              git fetch origin "$BRANCH"
              git rebase -X ours "origin/$BRANCH"
              if git push origin "HEAD:$BRANCH"; then
                exit 0
              fi
              sleep 3
            done
            echo 'Unable to publish shipping datasets after 5 attempts' >&2
            exit 1
          fi
      - name: Prepare shipping and preserve published contours
        run: |
          mkdir -p public/shipping
          cp shipping/*.geojson shipping/shipping.js public/shipping/
          cp site/index.html public/index.html
          touch public/.nojekyll
          curl -fL --retry 3 https://mbligh.github.io/mapping/contours.pmtiles -o public/contours.pmtiles
          python - <<'PY'
          from pathlib import Path
          p=Path('public/contours.pmtiles')
          with p.open('rb') as f:
              assert f.read(7)==b'PMTiles', 'Invalid published contour archive'
          assert p.stat().st_size>10000, 'Published contour archive is too small'
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

